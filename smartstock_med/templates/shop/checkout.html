<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation commande - SmartStock Med</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --rouge: #dc3545; --bleu-nuit: #1a2a4f; }
        .navbar-custom { background: var(--bleu-nuit); padding: 1rem 0; }
        .btn-confirm { background: var(--rouge); color: white; border-radius: 25px; padding: 12px 40px; border: none; }
        .btn-confirm:hover { background: #b02a37; color: white; }
        .order-summary { background: #f8f9fa; border-radius: 15px; padding: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand text-white" href="/shop/">
                <i class="fas fa-store"></i> SmartStock Med
            </a>
            <a href="/shop/cart/" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left"></i> Retour au panier
            </a>
        </div>
    </nav>
    
    <div class="container py-5">
        <div class="row">
            <div class="col-md-7">
                <h3><i class="fas fa-user"></i> Informations de livraison</h3>
                <form id="checkoutForm">
                    <div class="mb-3">
                        <label>Nom complet *</label>
                        <input type="text" id="customer_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email *</label>
                        <input type="email" id="customer_email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Téléphone *</label>
                        <input type="tel" id="customer_phone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Adresse de livraison *</label>
                        <textarea id="customer_address" class="form-control" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="col-md-5">
                <div class="order-summary">
                    <h4><i class="fas fa-receipt"></i> Récapitulatif</h4>
                    <div id="orderItems"></div>
                    <hr>
                    <h5>Total: <span id="orderTotal" class="text-danger">0</span> CFA</h5>
                    <button class="btn btn-confirm w-100 mt-3" onclick="submitOrder()">
                        <i class="fas fa-check-circle"></i> Confirmer ma commande
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        
        function displayOrder() {
            const container = document.getElementById('orderItems');
            let html = '';
            let total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                html += `
                    <div class="d-flex justify-content-between mb-2">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>${itemTotal.toLocaleString()} CFA</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('orderTotal').innerText = total.toLocaleString();
        }
        
        async function submitOrder() {
            const name = document.getElementById('customer_name').value;
            const email = document.getElementById('customer_email').value;
            const phone = document.getElementById('customer_phone').value;
            const address = document.getElementById('customer_address').value;
            
            if (!name || !email || !phone || !address) {
                alert('Veuillez remplir tous les champs');
                return;
            }
            
            const data = {
                customer_name: name,
                customer_email: email,
                customer_phone: phone,
                customer_address: address,
                items: cart.map(item => ({
                    product_id: item.id,
                    quantity: item.quantity
                }))
            };
            
            try {
                const response = await fetch('/shop/api/create-order/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    localStorage.removeItem('cart');
                    alert('✅ Commande validée avec succès !');
                    window.location.href = '/shop/';
                } else {
                    alert('Erreur: ' + result.error);
                }
            } catch(error) {
                alert('Erreur lors de la commande');
            }
        }
        
        if (cart.length === 0) {
            window.location.href = '/shop/';
        }
        
        displayOrder();
    </script>
</body>
</html>
