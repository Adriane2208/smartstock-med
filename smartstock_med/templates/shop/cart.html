<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon panier - SmartStock Med</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --rouge: #dc3545; --bleu-nuit: #1a2a4f; }
        .navbar-custom { background: var(--bleu-nuit); padding: 1rem 0; }
        .btn-checkout { background: var(--rouge); color: white; border-radius: 25px; padding: 10px 30px; border: none; }
        .btn-checkout:hover { background: #b02a37; color: white; }
        .cart-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand text-white" href="/shop/">
                <i class="fas fa-store"></i> SmartStock Med
            </a>
            <a href="/shop/" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left"></i> Continuer mes achats
            </a>
        </div>
    </nav>
    
    <div class="container py-5">
        <h2 class="mb-4"><i class="fas fa-shopping-cart"></i> Mon panier</h2>
        <div id="cartItems"></div>
        <div class="text-end mt-4">
            <h3>Total: <span id="cartTotal">0</span> CFA</h3>
            <button class="btn btn-checkout" onclick="goToCheckout()">
                <i class="fas fa-credit-card"></i> Valider la commande
            </button>
        </div>
    </div>
    
    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        
        function displayCart() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = '<div class="alert alert-info">Votre panier est vide</div>';
                document.getElementById('cartTotal').innerText = '0';
                return;
            }
            
            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                html += `
                    <div class="cart-item row align-items-center">
                        <div class="col-md-6">
                            <strong>${item.name}</strong>
                        </div>
                        <div class="col-md-2">
                            <input type="number" value="${item.quantity}" min="1" class="form-control" 
                                   onchange="updateQuantity(${index}, this.value)">
                        </div>
                        <div class="col-md-2">
                            ${item.price.toLocaleString()} CFA
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').innerText = total.toLocaleString();
        }
        
        function updateQuantity(index, quantity) {
            cart[index].quantity = parseInt(quantity);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        
        function goToCheckout() {
            if (cart.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            window.location.href = '/shop/checkout/';
        }
        
        displayCart();
    </script>
</body>
</html>
