services:
  - type: web
    name: smartstock-med-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn smartstock_med.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: smartstock-med-db
          property: connectionString
    databases:
      - name: smartstock-med-db
        plan: free
        databaseName: smartstock_med